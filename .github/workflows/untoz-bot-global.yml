name: Untoz Bot

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    name: Untoz Bot Report
    runs-on: ubuntu-latest
    steps:
      - name: Untoz Bot response
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- untoz-bot-global -->';
            const repo = context.repo;

            if (context.eventName === 'push') {
              const sha = context.payload.after;
              const commit = await github.rest.repos.getCommit({ owner: repo.owner, repo: repo.repo, ref: sha });
              const files = (commit.data.files || []).map(f => `- \\`${f.filename}\\` — ${f.status}`).join('\\n') || '- No file list available.';
              const body = `${marker}\n## 🤖 Untoz Bot\n\n**Commit detected**\n\n- **Repository:** \\`${repo.owner}/${repo.repo}\\`\n- **Commit:** [\\`${sha.slice(0, 7)}\\`](https://github.com/${repo.owner}/${repo.repo}/commit/${sha})\n- **Message:** ${commit.data.commit.message.split('\\n')[0]}\n\n### Changed files\n${files}\n\n🟢 Untoz Bot detected and recorded this change.`;
              await github.rest.repos.createCommitComment({ owner: repo.owner, repo: repo.repo, commit_sha: sha, body });
              return;
            }

            const pr = context.payload.pull_request;
            const number = pr.number;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner: repo.owner, repo: repo.repo, pull_number: number, per_page: 100 });
            const summary = files.slice(0, 50).map(f => `- \\`${f.filename}\\` — ${f.status}`).join('\\n') || '- No changed files reported.';
            const body = `${marker}\n## 🤖 Untoz Bot\n\n### Pull Request detected\n\n- **PR:** #${number}\n- **Title:** ${pr.title}\n- **Author:** @${pr.user.login}\n- **Changed files:** ${files.length}\n\n### Changes\n${summary}${files.length > 50 ? `\\n- …and ${files.length - 50} more files.` : ''}\n\n🟢 Untoz Bot detected the update and will track subsequent changes to this PR.`;

            const comments = await github.paginate(github.rest.issues.listComments, { owner: repo.owner, repo: repo.repo, issue_number: number, per_page: 100 });
            const existing = comments.reverse().find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: repo.owner, repo: repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: repo.owner, repo: repo.repo, issue_number: number, body });
            }

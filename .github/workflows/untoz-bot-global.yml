name: Untoz Bot

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  report:
    name: Untoz Bot Report
    runs-on: ubuntu-latest
    steps:
      - name: Untoz Bot response
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- untoz-bot-global -->';
            const repo = context.repo;
            if (context.eventName === 'push') {
              const sha = context.payload.after;
              const commit = await github.rest.repos.getCommit({ owner: repo.owner, repo: repo.repo, ref: sha });
              const files = (commit.data.files || []).map(f => '- ' + f.filename + ' — ' + f.status).join('\n') || '- No file list available.';
              const summary = 'Commit detected in ' + repo.owner + '/' + repo.repo + '\n\n' + commit.data.commit.message.split('\n')[0] + '\n\nChanged files: ' + (commit.data.files || []).length + '\n\n' + files;
              await github.rest.checks.create({ owner: repo.owner, repo: repo.repo, name: 'Untoz Bot', head_sha: sha, status: 'completed', conclusion: 'success', output: { title: 'Untoz Bot — change detected', summary } });
              return;
            }
            const pr = context.payload.pull_request; const number = pr.number;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner: repo.owner, repo: repo.repo, pull_number: number, per_page: 100 });
            const summary = files.slice(0, 50).map(f => '- ' + f.filename + ' — ' + f.status).join('\n') || '- No changed files reported.';
            const extra = files.length > 50 ? '\n- …and ' + (files.length - 50) + ' more files.' : '';
            const body = [marker, '## 🤖 Untoz Bot', '', '### Pull Request detected', '', '- PR: #' + number, '- Title: ' + pr.title, '- Author: @' + pr.user.login, '- Changed files: ' + files.length, '', '### Changes', summary + extra, '', '🟢 Untoz Bot detected the update and will track subsequent changes to this PR.'].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner: repo.owner, repo: repo.repo, issue_number: number, per_page: 100 });
            const existing = comments.reverse().find(c => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: repo.owner, repo: repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: repo.owner, repo: repo.repo, issue_number: number, body });

name: AURA Windows Preview Build

on:
  push:
    branches:
      - codex/alpha2-intelligent-planner-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Alpha 2 Windows preview
    runs-on: windows-latest

    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop runtime and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
          python -m pip install pyinstaller

      - name: Build native Windows application
        shell: pwsh
        run: ./scripts/build_desktop.ps1

      - name: Verify preview package
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "AURA-1-*-windows-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "Windows preview ZIP was not produced." }
          $checksum = "$($zip.FullName).sha256"
          if (-not (Test-Path $checksum)) { throw "SHA-256 checksum was not produced." }
          Write-Host "Preview ready: $($zip.Name)"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: AURA-1-0.2.0-alpha.1-windows-x64-preview
          path: |
            dist/AURA-1-0.2.0-alpha.1-windows-x64.zip
            dist/AURA-1-0.2.0-alpha.1-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

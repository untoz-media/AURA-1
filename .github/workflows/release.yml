name: Publish AURA release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged version
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the source package
        run: python scripts/build_release.py

      - name: Create the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/*.sha256
          --title "AURA-1 $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
          --prerelease

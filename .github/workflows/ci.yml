name: AURA-1 CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  planner:
    name: Intelligent Agent Runtime
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pytest psutil

      - name: Compile Alpha 2 agent runtime
        run: >-
          python -m py_compile
          aura.py
          aura/agent/action_executor.py
          aura/agent/intelligent_planner.py
          aura/agent/recovery_planner.py
          aura/agent/state_observer.py
          aura/agent/tool_router.py
          aura/agent/planner.py
          aura/agent/plan_executor.py
          aura/agent/permission_manager.py

      - name: Run Alpha 2 agent tests
        run: >-
          python -m pytest -q
          tests/test_intelligent_planner.py
          tests/test_plan_executor.py
          tests/test_recovery_planner.py
          tests/test_state_observer.py
